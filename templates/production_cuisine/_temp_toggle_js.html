<script>
(function () {
  document.querySelectorAll(".temp-toggle-sign").forEach(function (btn) {
    btn.addEventListener("click", function () {
      var input = btn.previousElementSibling;
      if (!input) return;
      var v = input.value.trim();
      if (v.startsWith("-")) {
        input.value = v.slice(1);
      } else if (v) {
        input.value = "-" + v;
      } else {
        input.value = "-";
      }
      input.focus();
    });
  });
})();
</script>
