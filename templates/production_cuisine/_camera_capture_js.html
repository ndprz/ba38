<script>
(function () {
  // Réduit la photo avant envoi (8 Mpx ~2 Mo → 1600 px ~180 Ko) : envoi
  // plus rapide en Wi-Fi et moins de disque. Même réglage que
  // PHOTO_MAX_PX / PHOTO_QUALITE_JPEG côté serveur (ba38_cuisine/utils.py),
  // qui réduit de toute façon si ce traitement échoue (on envoie alors
  // l'original, jamais de photo perdue).
  var PHOTO_MAX_PX = 1600, PHOTO_QUALITE = 0.8;

  function reduirePhoto(file) {
    return new Promise(function (resolve) {
      if (!file.type || file.type.indexOf("image/") !== 0) return resolve(file);
      var url = URL.createObjectURL(file);
      var img = new Image();
      img.onload = function () {
        URL.revokeObjectURL(url);
        var w = img.naturalWidth, h = img.naturalHeight;
        var ratio = Math.min(1, PHOTO_MAX_PX / Math.max(w, h));
        if (ratio >= 1) return resolve(file);
        var canvas = document.createElement("canvas");
        canvas.width = Math.round(w * ratio);
        canvas.height = Math.round(h * ratio);
        canvas.getContext("2d").drawImage(img, 0, 0, canvas.width, canvas.height);
        canvas.toBlob(function (blob) {
          if (!blob) return resolve(file);
          var nom = (file.name || "photo").replace(/\.[^.]*$/, "") + ".jpg";
          resolve(new File([blob], nom, { type: "image/jpeg", lastModified: Date.now() }));
        }, "image/jpeg", PHOTO_QUALITE);
      };
      img.onerror = function () { URL.revokeObjectURL(url); resolve(file); };
      img.src = url;
    });
  }

  function initCameraCapture(root) {
    (root || document).querySelectorAll(".camera-multi-capture").forEach(function (container) {
    if (container.dataset.cameraInit) return;
    container.dataset.cameraInit = "1";
    var addBtn = container.querySelector(".camera-add-btn");
    var hiddenInput = container.querySelector(".camera-hidden-input");
    var submitInput = container.querySelector(".camera-submit-input");
    var preview = container.querySelector(".camera-preview");
    var fichiers = [];

    function syncSubmitInput() {
      var dt = new DataTransfer();
      fichiers.forEach(function (f) { dt.items.add(f); });
      submitInput.files = dt.files;
    }

    function renderPreview() {
      preview.innerHTML = "";
      fichiers.forEach(function (file, idx) {
        var url = URL.createObjectURL(file);
        var wrap = document.createElement("div");
        wrap.className = "position-relative";
        wrap.style.width = "80px";
        wrap.innerHTML =
          '<img src="' + url + '" style="height:80px;width:80px;object-fit:cover;border-radius:4px;">' +
          '<button type="button" class="btn btn-sm btn-danger position-absolute top-0 end-0 p-0" ' +
          'style="width:22px;height:22px;line-height:1;">×</button>';
        wrap.querySelector("button").addEventListener("click", function () {
          fichiers.splice(idx, 1);
          renderPreview();
          syncSubmitInput();
        });
        preview.appendChild(wrap);
      });
    }

    addBtn.addEventListener("click", function () {
      hiddenInput.value = "";
      hiddenInput.click();
    });

    hiddenInput.addEventListener("change", function () {
      if (hiddenInput.files && hiddenInput.files.length) {
        reduirePhoto(hiddenInput.files[0]).then(function (f) {
          fichiers.push(f);
          renderPreview();
          syncSubmitInput();
        });
      }
    });
    });
  }

  window.initCameraCapture = initCameraCapture;
  initCameraCapture(document);
})();
</script>
