{% extends "base.html" %}
{% block content %}

<!-- ===================================================== -->
<!-- 🧾 TITRE -->
<!-- ===================================================== -->
<h2 class="mb-2">📝 Saisie ramasse partenaire</h2>

<div class="text-muted mb-3">
    Modèle : <strong>{{ entete.nom_type }}</strong>
</div>

<div class="d-flex justify-content-end">
    <a href="{{ url_for('distribution.distribution_main') }}"
       class="btn btn-success btn-sm me-4">
       ↩️ Retour Distribution
    </a>
</div>

<form method="post">

    <!-- ===================================================== -->
    <!-- 📦 ENTÊTE -->
    <!-- ===================================================== -->
    <div class="card p-3 mb-3">

        <div class="row g-3 align-items-end">

            <!-- DATE -->
            <div class="col-md-2">
                <label class="form-label">Date</label>
                <input type="date" name="date_saisie" class="form-control" value="{{ today }}">
            </div>

            <!-- FOURNISSEUR -->
            <div class="col-md-4">
                <label class="form-label">Fournisseur</label>
                <input type="text" class="form-control" value="{{ entete.nom_fournisseur }}" readonly>
            </div>

            <!-- ASSOCIATION -->
            <div class="col-md-4">
                <label class="form-label">Association</label>
                <input type="text" class="form-control" value="{{ entete.nom_association }}" readonly>
            </div>

            <!-- POIDS TOTAL -->
            <div class="col-md-1">
                <label class="form-label">Kg</label>
                <input type="number" step="0.1" id="poids_total" class="form-control">
            </div>

            <!-- AUTO -->
            <div class="col-md-1">
                <button type="button" class="btn btn-primary w-100" onclick="repartitionAuto()">
                    ⚙️
                </button>
            </div>

        </div>

    </div>


    <!-- ===================================================== -->
    <!-- 📋 TABLE -->
    <!-- ===================================================== -->
    <div class="table-responsive">

        <table class="table table-sm table-bordered align-middle" style="font-size: 1rem;">

            <thead class="table-light">
                <tr>
                    <th style="width: 20%">Code VIF</th>
                    <th style="width: 50%">Article</th>
                    <th style="width: 15%">%</th>
                    <th style="width: 15%">Kg</th>
                </tr>
            </thead>

            <tbody>

                {% for l in lignes %}
                <tr>
                    <td>{{ l.code_vif }}</td>
                    <td>{{ l.libelle }}</td>
                    <td class="text-end">{{ l.repartition }}</td>

                    <td>
                        <input type="number" step="0.1" name="poids_{{ l.code_vif }}" class="form-control poids"
                            data-repartition="{{ l.repartition }}" placeholder="0">
                    </td>
                </tr>
                {% endfor %}

            </tbody>

        </table>

    </div>


    <!-- ===================================================== -->
    <!-- 🔘 BOUTONS -->
    <!-- ===================================================== -->
    <div class="mt-3 d-flex justify-content-between">

        <a href="{{ url_for('distribution.ramasse_types_list') }}" class="btn btn-secondary">
            ⬅ Retour
        </a>

        <button type="submit" class="btn btn-success">
            💾 Enregistrer
        </button>

    </div>

</form>


<!-- ===================================================== -->
<!-- ⚙️ JAVASCRIPT -->
<!-- ===================================================== -->
<script>

    // ⚙️ répartition basée sur % du modèle
    function repartitionAuto() {

        let total = parseFloat(
            document.getElementById("poids_total").value
        );

        if (!total || total <= 0) {
            alert("Saisir un poids total valide");
            return;
        }

        document.querySelectorAll(".poids").forEach(input => {

            let rep = parseFloat(input.dataset.repartition) || 0;
            let valeur = total * rep / 100;

            input.value = valeur.toFixed(1);
        });

        majTotal();
    }


    // 🔄 recalcul total
    function majTotal() {

        let total = 0;

        document.querySelectorAll(".poids").forEach(i => {
            total += parseFloat(i.value) || 0;
        });

        document.getElementById("poids_total").value =
            total.toFixed(1);
    }


    // 🔁 listener
    document.querySelectorAll(".poids").forEach(input => {
        input.addEventListener("input", majTotal);
    });

</script>

{% endblock %}
