{% extends "base.html" %}
{% block title %}Découpe des factures{% endblock %}

{% block content %}
<div class="container mt-4">

  <h2>📑 Découper un fichier de factures</h2>

  <p class="text-muted">
    Téléversez un PDF contenant plusieurs factures.
    Un fichier ZIP sera généré avec une facture par fichier.
  </p>

  <form method="post" enctype="multipart/form-data">

    <div class="mb-3">
      <label class="form-label">Fichier PDF</label>
      <input type="file" name="pdf_file" accept=".pdf" class="form-control" required>
    </div>

    <button class="btn btn-primary">
      🚀 Découper et télécharger
    </button>

    <a href="{{ url_for('tresorerie.tresorerie') }}" class="btn btn-outline-dark">
      ↩️ Retour Trésorerie
    </a>

  </form>

</div>
{% endblock %}
