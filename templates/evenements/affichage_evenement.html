<!doctype html>
<html lang="fr">

<head>
  <meta charset="utf-8">
  <title>Affichage Événements</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">



  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #000;
      color: #fff;
      font-family: system-ui, sans-serif;
      overflow: hidden;
    }

    body {
      cursor: none;
    }

    .duree-badge {
      position: absolute;
      bottom: 8px;
      left: 8px;
      background: rgba(0, 0, 0, 0.7);
      color: #fff;
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 0.8rem;
      z-index: 100;
    }


    #zone {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
      transition: opacity 0.8s ease-in-out;
    }

    .hidden {
      opacity: 0;
    }

    .fullscreen {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      object-fit: contain;
      object-position: center;
      background: #000;
      border: none;
      display: block;
    }

    .docSlide {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      display: none;
      align-items: center;
      justify-content: center;
      background: #000;
      transition: opacity 0.8s ease-in-out;
    }

    .docSlide.active {
      display: flex;
      opacity: 1;
    }

    .docSlide img {
      max-width: 100vw;
      max-height: 100vh;
      object-fit: contain;
      display: block;
    }

    .msg {
      text-align: center;
      max-width: 90vw;
    }

    .msg h1 {
      font-size: 3rem;
      color: #ff7f00;
      margin-bottom: 0.5rem;
    }

    .msg p {
      font-size: 2rem;
      line-height: 1.4;
      margin-top: 0.5rem;
      color: #fff;
    }

    video::-webkit-media-controls {
      display: none !important;
    }

    .planning {
      width: 92vw;
      height: 92vh;
      text-align: center;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .planning h1 {
      flex: 0 0 auto;
      font-size: 3rem;
      color: #ff7f00;
      margin: 0 0 1.5rem;
    }

    .planGrid {
      flex: 1 1 auto;
      min-height: 0;
      column-count: 2;
      column-gap: 3rem;
      column-fill: auto;
      text-align: left;
      overflow: hidden;
    }

    .planRow {
      display: flex;
      align-items: center;
      gap: 1rem;
      margin-bottom: 1.2rem;
      break-inside: avoid;
    }

    .planHeure {
      flex: 0 0 auto;
      min-width: 4.5rem;
      max-width: 9rem;
      min-height: 4.5rem;
      padding: 0.3rem 0.6rem;
      border-radius: 50%;
      border: 4px solid #7a1f2d;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      font-weight: bold;
      font-size: 1.2rem;
      color: #000;
      background: #fff;
      overflow-wrap: break-word;
    }

    .planBox {
      flex: 1 1 auto;
      min-width: 0;
      background: #f5a041;
      border: 3px solid #b56b1a;
      border-radius: 12px;
      padding: 0.8rem 1.2rem;
      font-weight: bold;
      font-size: 1.4rem;
      color: #1a1a1a;
      line-height: 1.3;
      overflow-wrap: break-word;
    }

    .planning.dense .planRow {
      margin-bottom: 0.7rem;
    }

    .planning.dense .planHeure {
      min-width: 3.4rem;
      min-height: 3.4rem;
      font-size: 0.9rem;
    }

    .planning.dense .planBox {
      font-size: 1.05rem;
      padding: 0.5rem 0.8rem;
      line-height: 1.2;
    }

    .planning.denser .planRow {
      margin-bottom: 0.35rem;
    }

    .planning.denser .planHeure {
      min-width: 2.6rem;
      min-height: 2.6rem;
      font-size: 0.75rem;
      border-width: 3px;
    }

    .planning.denser .planBox {
      font-size: 0.85rem;
      padding: 0.35rem 0.6rem;
      line-height: 1.15;
    }

    .badge {
      position: fixed;
      right: 8px;
      bottom: 8px;
      opacity: .25;
      font-size: .8rem;
    }

    html {
      cursor: none;
    }
  </style>
</head>

<body onclick="startFullscreen()">

  <div id="zone">
    <div class="msg">
      <h1>Chargement…</h1>
      <p>Merci de patienter.</p>
    </div>
  </div>

  <div class="badge">BA380 • Écran événements</div>

  <script>

    // =========================================================
    // 🔧 VARIABLES GLOBALES
    // =========================================================
    let playlist = [];
    let index = 0;
    let timer = null;
    let slideInterval = null;
    let prochainHTML = null;
    let pause = false;

    // =========================================================
    // 🧹 CLEAN TIMERS
    // =========================================================
    function clearAllTimers() {
      if (timer) {
        clearTimeout(timer);
        timer = null;
      }
      if (slideInterval) {
        clearInterval(slideInterval);
        slideInterval = null;
      }
    }

    // =========================================================
    // ⌨️ CLAVIER
    // =========================================================
    document.addEventListener("keydown", (e) => {

      if (e.key === "ArrowDown") {
        e.preventDefault();
        forceNext();
      }

      if (e.key === "ArrowUp") {
        e.preventDefault();
        forcePrev();
      }

      if (e.key === " ") {
        e.preventDefault();
        pause = !pause;
        console.log("Pause =", pause);
      }

    });

    function forceNext() {
      if (!playlist.length) return;
      clearAllTimers();
      index = (index + 1) % playlist.length;
      playNext();
    }

    function forcePrev() {
      if (!playlist.length) return;
      clearAllTimers();
      index = (index - 1 + playlist.length) % playlist.length;
      playNext();
    }

    // =========================================================
    // 🖥️ FULLSCREEN
    // =========================================================
    function startFullscreen() {
      if (document.fullscreenElement) return;
      document.documentElement.requestFullscreen?.();
    }

    document.addEventListener("click", startFullscreen);
    document.addEventListener("keydown", startFullscreen);

    setTimeout(() => document.body.click(), 1500);

    window.addEventListener("load", () => {
      setTimeout(startFullscreen, 1000);
    });

    // refresh auto
    setInterval(() => location.reload(), 300000);

    // =========================================================
    // 🧠 UTILS
    // =========================================================
    function prechargerSuivant() {
      if (!playlist.length) return;
      const next = playlist[(index + 1) % playlist.length];
      prochainHTML = htmlPour(next);
    }

    function sortImagesByPage(images) {
      return [...images].sort((a, b) => {
        const get = (x) => {
          const m = x.match(/_page_(\d+)/);
          return m ? parseInt(m[1]) : 9999;
        };
        return get(a) - get(b);
      });
    }

    // =========================================================
    // 🗓️ AJUSTEMENT AUTO DU PLANNING (fait tenir le contenu à l'écran)
    // =========================================================
    function ajusterPlanning(zone) {
      const container = zone.querySelector(".planning");
      const grid = zone.querySelector(".planGrid");
      if (!container || !grid) return;

      container.classList.remove("dense", "denser");

      // en colonnes CSS (column-count fixe), un contenu trop long ne grandit
      // pas la hauteur : il déborde en largeur via des colonnes implicites.
      const deborde = () =>
        grid.scrollWidth > grid.clientWidth + 2 ||
        grid.scrollHeight > grid.clientHeight + 2;

      let colonnes = 2;
      grid.style.columnCount = colonnes;

      while (deborde() && colonnes < 5) {
        colonnes++;
        grid.style.columnCount = colonnes;
      }

      if (deborde()) container.classList.add("dense");
      if (deborde()) container.classList.add("denser");
    }

    // =========================================================
    // 🧩 HTML GENERATION
    // =========================================================
    function htmlPour(e) {

      // 🎥 VIDEO
      if (e.type === "video") {

        let src = e.fichier_path || e.contenu || "";

        if (!src.startsWith("/static/")) {
          src = "/static/evenements/" + src.split("/").pop();
        }

        const base = src.replace(/\.[^/.]+$/, "");
        const trackPath = base + ".vtt";

        return `
    <video class="fullscreen" muted playsinline preload="auto">
      <source src="${src}" type="video/mp4">
      <track src="${trackPath}" kind="subtitles" srclang="fr" label="Français" default>
    </video>
  `;
      }

      // 📄 DOCUMENT
      if (e.type === "document") {

        if (e.images && e.images.length) {
          const imgs = sortImagesByPage(e.images);
          return imgs.map((img, i) => `
        <div class="docSlide ${i === 0 ? 'active' : ''}">
          <img src="${img}" class="fullscreen">
        </div>
      `).join("");
        }

        return `<iframe class="fullscreen" src="${e.fichier_path}"></iframe>`;
      }

      // 🗓️ PLANNING (passages associations)
      if (e.type === "planning") {

        const passages = e.passages || [];

        const rows = passages.map(p => `
          <div class="planRow">
            <div class="planHeure">${p.heure}</div>
            <div class="planBox">${p.lignes.join("<br>")}</div>
          </div>
        `).join("");

        return `
      <div class="planning">
        <h1>${e.titre || ""}</h1>
        <div class="planGrid">${rows}</div>
      </div>
    `;
      }

      // 💬 MESSAGE + IMAGE
      const titre = e.titre || "";
      const contenu = e.contenu || "";

      const img = e.image_path
        ? `<div style="margin-top:2rem;">
       <img src="${e.image_path}"
            style="max-height:50vh; max-width:90vw; object-fit:contain; border-radius:10px;">
     </div>`
        : "";

      return `
  <div class="msg">
    <h1>${titre}</h1>
    <p>${contenu}</p>
    ${img}
  </div>
`;
    }

    // =========================================================
    // ▶️ LECTURE
    // =========================================================
    function playNext() {

      clearAllTimers();

      const zone = document.getElementById("zone");

      if (!playlist.length) {
        zone.innerHTML = "<h1>Aucun événement</h1>";
        return;
      }

      const ev = playlist[index];

      zone.classList.add("hidden");

      setTimeout(() => {

        zone.innerHTML = prochainHTML || htmlPour(ev);
        prechargerSuivant();

        if (ev.type === "planning") {
          ajusterPlanning(zone);
        }

        zone.classList.remove("hidden");

        const slides = zone.querySelectorAll(".docSlide");

        // =====================================================
        // 📸 DIAPORAMA
        // =====================================================
        if (slides.length > 1) {

          let i = 0;
          const interval = (ev.duree_affichage || 8) * 1000;

          slides.forEach((s, idx) => s.classList.toggle("active", idx === 0));

          slideInterval = setInterval(() => {

            i++;

            if (i >= slides.length) {
              clearInterval(slideInterval);
              nextEvent();
              return;
            }

            slides.forEach((s, idx) => s.classList.toggle("active", idx === i));

          }, interval);

          return;
        }

        // =====================================================
        // 🎥 VIDEO
        // =====================================================
        const video = zone.querySelector("video");

        if (video) {

          video.muted = true;


          video.onloadeddata = () => {
            const tracks = video.textTracks;
            if (tracks.length > 0) {
              tracks[0].mode = "showing";
            }
          };

          video.oncanplay = () => {
            video.play().catch(() => {
              console.warn("autoplay bloqué");
              timer = setTimeout(nextEvent, 5000);
            });
          };

          video.onended = () => {
            if (!pause) nextEvent();
          };

          video.onerror = () => {
            console.warn("erreur video");
            nextEvent();
          };

          return;
        }

        // =====================================================
        // 🖼️ IMAGE / TEXTE
        // =====================================================
        if (!pause) {
          timer = setTimeout(nextEvent, (ev.duree_affichage || 10) * 1000);
        }

      }, 400);

    }

    // =========================================================
    // 🔁 NEXT
    // =========================================================
    function nextEvent() {
      index = (index + 1) % playlist.length;
      playNext();
    }

    // =========================================================
    // 🔄 REFRESH API
    // =========================================================
    async function refresh() {

      try {
        const r = await fetch("/api/evenements_actifs", { cache: "no-store" });
        const data = await r.json();

        const newIds = data.map(d => d.id).sort().join(",");
        const oldIds = playlist.map(d => d.id).sort().join(",");

        if (newIds !== oldIds) {
          playlist = data;
          index = 0;
          playNext();
        }

      } catch (e) {
        console.error("refresh error", e);
      }

    }

    // =========================================================
    // 🚀 INIT
    // =========================================================
    (async () => {
      await refresh();
      setInterval(refresh, 30000);
      if (!playlist.length) playNext();
    })();

  </script>



</body>

</html>
