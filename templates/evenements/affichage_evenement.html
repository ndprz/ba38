<!doctype html>
<html lang="fr">

<head>
  <meta charset="utf-8">
  <title>Affichage Événements</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">



  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #000;
      color: #fff;
      font-family: system-ui, sans-serif;
      overflow: hidden;
    }

    body {
      cursor: none;
    }

    .duree-badge {
      position: absolute;
      bottom: 8px;
      left: 8px;
      background: rgba(0, 0, 0, 0.7);
      color: #fff;
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 0.8rem;
      z-index: 100;
    }


    #zone {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
      transition: opacity 0.8s ease-in-out;
    }

    .hidden {
      opacity: 0;
    }

    .fullscreen {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      object-fit: contain;
      object-position: center;
      background: #000;
      border: none;
      display: block;
    }

    .docSlide {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      display: none;
      align-items: center;
      justify-content: center;
      background: #000;
      transition: opacity 0.8s ease-in-out;
    }

    .docSlide.active {
      display: flex;
      opacity: 1;
    }

    .docSlide img {
      max-width: 100vw;
      max-height: 100vh;
      object-fit: contain;
      display: block;
    }

    .msg {
      text-align: center;
      max-width: 90vw;
    }

    .msg h1 {
      font-size: 3rem;
      color: #ff7f00;
      margin-bottom: 0.5rem;
    }

    .msg p {
      font-size: 2rem;
      line-height: 1.4;
      margin-top: 0.5rem;
      color: #fff;
    }

    video::-webkit-media-controls {
      display: none !important;
    }

    .badge {
      position: fixed;
      right: 8px;
      bottom: 8px;
      opacity: .25;
      font-size: .8rem;
    }

    html {
      cursor: none;
    }
  </style>
</head>

<body onclick="startFullscreen()">

  <div id="zone">
    <div class="msg">
      <h1>Chargement…</h1>
      <p>Merci de patienter.</p>
    </div>
  </div>

  <div class="badge">BA380 • Écran événements</div>

  <script>

    document.body.style.cursor = "none";

    let prochainHTML = null;

    function startFullscreen() {

      if (document.fullscreenElement) return;

      const el = document.documentElement;

      if (el.requestFullscreen) {
        el.requestFullscreen();
      } else if (el.webkitRequestFullscreen) {
        el.webkitRequestFullscreen();
      } else if (el.msRequestFullscreen) {
        el.msRequestFullscreen();
      }
    }

    // interaction utilisateur
    document.addEventListener("click", startFullscreen);
    document.addEventListener("keydown", startFullscreen);

    // tentative automatique
    setTimeout(() => {
      document.body.click();
    }, 1500);
    // clic
    document.addEventListener("click", startFullscreen);

    // touche clavier
    document.addEventListener("keydown", startFullscreen);

    // tentative automatique (certains navigateurs l’acceptent)
    window.addEventListener("load", () => {
      setTimeout(startFullscreen, 1000);
    });
    setInterval(function () {
      location.reload();
    }, 300000);


    document.addEventListener("fullscreenchange", () => {
      if (!document.fullscreenElement) {
        setTimeout(startFullscreen, 1000);
      }
    });

    const evenements = JSON.parse('{{ evenements | default([]) | tojson | safe }}');

    let playlist = [];
    let index = 0;
    let timer = null;

    function prechargerSuivant() {

      if (playlist.length === 0) return;

      const nextIndex = (index + 1) % playlist.length;
      const nextEvent = playlist[nextIndex];

      prochainHTML = htmlPour(nextEvent);
    }

    function sortImagesByPage(images) {
      // Ex: "..._page_12.jpg" → 12
      const pageNum = (p) => {
        const m = String(p).match(/_page_(\d+)\.(?:jpe?g|png|webp)$/i);
        return m ? parseInt(m[1], 10) : Number.MAX_SAFE_INTEGER; // sans numéro → à la fin
      };
      // Tri numérique stable
      return [...images].sort((a, b) => pageNum(a) - pageNum(b));
    }


    // =========================================================
    // 🧩 Génération du contenu HTML
    // =========================================================
    function htmlPour(e) {

      // === 🎥 Vidéo ===
      if (e.type === "video") {
        let src = (e.fichier_path && e.fichier_path.trim()) || e.contenu || "";
        if (!src.startsWith("/static/")) src = "/static/evenements/" + src.split("/").pop();
        const base = src.replace(/\.[^/.]+$/, "");
        const trackPath = base + ".vtt";
        const dureeAffichage = e.duree_affichage ? `<div class="duree-badge">${Math.round(e.duree)} secondes</div>` : "";
        return `
          <div style="position: relative; width: 100vw; height: 100vh;">
            <video class="fullscreen" autoplay playsinline muted>
              <source src="${src}" type="video/mp4">
              <track src="${trackPath}" kind="subtitles" srclang="fr" label="Français" default>
            </video>
            ${dureeAffichage}
          </div>`;
      }

      // === 📄 Document (PDF ou images converties) ===
      if (e.type === "document") {
        const src = (e.fichier_path && e.fichier_path.trim()) || e.contenu || "";
        const srcStr = String(src || "").toLowerCase();

        // 🖼️ PRIORITÉ ABSOLUE : images si disponibles
        if (e.images && e.images.length > 0) {
          const ordered = sortImagesByPage(e.images);
          const slides = ordered.map((img, i) => `
          <div class="docSlide${i === 0 ? ' active' : ''}">
            <img src="${img}" class="fullscreen">
          </div>`).join("");
          return `<div id="diaporama" style="position:relative; width:100vw; height:100vh;">${slides}</div>`;
        }


        // 🧾 PDF brut
        if ((!e.images || e.images.length === 0) && srcStr.endsWith(".pdf")) {
          return `<iframe class="fullscreen" src="${src}#view=FitH" allow="fullscreen"></iframe>`;
        }

        // 🖼️ Image directe
        if (srcStr.match(/\.(jpg|jpeg|png|gif|webp)$/)) {
          return `<img src="${src}" class="fullscreen">`;
        }

        // Fallback
        return `<iframe class="fullscreen" src="${src}"></iframe>`;
      }

      // === 💬 Message texte ===
      const titre = e.titre || "";
      const contenu = e.contenu || "";
      const img = e.image_path
        ? `<div style="margin-top:2rem;">
             <img src="${e.image_path}" class="fullscreen" style="max-height:50vh; max-width:90vw; object-fit:contain; border-radius:10px;">
           </div>`
        : "";

      return `<div class="msg"><h1>${titre}</h1><p>${contenu}</p>${img}</div>`;
    }

    // =========================================================
    // 🔁 Affichage de l'événement suivant
    // =========================================================
    function playNext() {
      const zone = document.getElementById("zone");

      if (playlist.length === 0) {
        zone.innerHTML = `<div class="msg"><h1>Aucun événement en cours</h1></div>`;
        return;
      }

      const ev = playlist[index];
      zone.classList.add("hidden");

      setTimeout(() => {
        zone.innerHTML = prochainHTML || htmlPour(ev);
        prechargerSuivant();
        zone.classList.remove("hidden");

        // 🖼️ Diaporama (si plusieurs images)
        const slides = zone.querySelectorAll(".docSlide");

        if (slides.length > 1) {

          let i = 0;
          const interval = (ev.duree_affichage || 8) * 1000;

          // affichage initial
          slides.forEach((s, idx) => s.classList.toggle("active", idx === 0));

          const loop = setInterval(() => {

            i++;

            if (i >= slides.length) {
              clearInterval(loop);
              nextEvent();
              return;
            }

            slides.forEach((s, idx) => s.classList.toggle("active", idx === i));

          }, interval);

        }
        else {

          const video = zone.querySelector("video");

          if (video) {

            // 🎥 attendre la fin de la vidéo
            video.onended = () => {
              nextEvent();
            };

          } else {

            // 🖼 image / pdf / message
            setTimeout(nextEvent, (ev.duree_affichage || 10) * 1000);

          }

        }
      }, 400);

      function nextEvent() {
        index = (index + 1) % playlist.length;
        playNext();
      }
    }

    // =========================================================
    // 🔄 Récupération de la playlist
    // =========================================================
    async function refresh() {
      try {
        const r = await fetch("/api/evenements_actifs", { cache: "no-store" });
        const data = await r.json();
        const changed = JSON.stringify(data.map(d => d.id)) !== JSON.stringify(playlist.map(d => d.id));
        playlist = data;
        if (changed) {
          index = 0;
          playNext();
        }
      } catch (e) {
        console.error("Erreur lors du refresh:", e);
      }
    }

    (async () => {
      await refresh();
      setInterval(refresh, 30000);
      if (playlist.length === 0) playNext();
    })();
  </script>
</body>

</html>
