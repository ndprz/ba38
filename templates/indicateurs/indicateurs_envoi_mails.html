{% extends "base.html" %}
{% block content %}

<h2>📤 Envoi des mails</h2>

<button class="btn btn-outline-info btn-sm mb-3"
        type="button"
        data-bs-toggle="modal"
        data-bs-target="#modalAide">
    ℹ️ Aide utilisateur
</button>

<p><strong>{{ nb }}</strong> associations à relancer (Non reçu)</p>

<form method="POST">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

    <div class="mb-3">
        <label>Modèle de mail</label>

        <select name="modele_id" class="form-select" required>

            <!-- 🔥 option par défaut -->
            <option value="" disabled selected>-- Choisir un modèle --</option>

            {% for m in modeles %}
            <option value="{{ m.id }}">{{ m.code_modele }}</option>
            {% endfor %}

        </select>
    </div>
    

    <!-- 🔍 APERÇU ICI -->
    <div id="previewModele" class="mt-3 p-3 border bg-light small">
        <em>Sélectionnez un modèle pour aperçu</em>
    </div>

    <!-- ================= EXPEDITEUR ================= -->
    <div class="mb-3">
        <label class="form-label">Expéditeur</label>
        <select name="sender" class="form-select">

            <option value="ba380@banquealimentaire.org" selected>
                ba380@banquealimentaire.org (défaut)
            </option>

            <option value="ba380.ticadi@banquealimentaire.org">
                ba380.ticadi@banquealimentaire.org
            </option>

            <option value="ba380.informatique2@banquealimentaire.org">
                ba380.informatique2@banquealimentaire.org
            </option>
        </select>
    </div>

    <!-- ================= MODE TEST ================= -->
    <div class="form-check mb-3">
        <input type="checkbox" name="mode_test" class="form-check-input" id="testMode" checked>
        <label class="form-check-label" for="testMode">
            🧪 Mode TEST (2 mails vers ba380.banquealimentaire.org)
        </label>
    </div>

    <!-- ================= ACTIONS ================= -->
    <div class="d-flex gap-2">
        <button class="btn btn-success" id="btnEnvoyer">
            📤 Envoyer
        </button>

        <a href="{{ url_for('indicateurs.resultats', campagne_id=campagne.id) }}" class="btn btn-secondary">
            Annuler
        </a>
    </div>

</form>

<script>
    document.querySelector("form").addEventListener("submit", function (e) {
        const modeTest = document.getElementById("testMode").checked;
        if (!modeTest) {
            const ok = confirm(
                "⚠️ Mode TEST décoché : vous allez envoyer {{ nb }} vrais emails aux associations (avec pièce jointe PDF).\n\nContinuer ?"
            );
            if (!ok) {
                e.preventDefault();
            }
        }
    });
</script>

<!-- Modeale AIDE -->
<div class="modal fade" id="modalAide" tabindex="-1">
  <div class="modal-dialog modal-xl">
    <div class="modal-content">

      <div class="modal-header">
        <h5 class="modal-title">📊 Aide – Module Indicateurs ÉTAT</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>

      <div class="modal-body" style="
          max-height: 70vh;
          overflow:auto;
          font-size: 0.9rem;
          line-height: 1.4;
      ">

        {% include "docsHtml/indicateurs_aide.html" %}

      </div>

      <div class="modal-footer">
        <button class="btn btn-outline-primary" onclick="printModal('modalAide')">
            🖨️ Imprimer
        </button>
        <button class="btn btn-secondary" data-bs-dismiss="modal">
            Fermer
        </button>
      </div>

    </div>
  </div>
</div>

{% endblock %}
