{% extends "base.html" %}

{% block content %}

<div class="container d-flex justify-content-center align-items-center" style="min-height: 70vh;">

    <div class="card shadow p-4" style="max-width: 400px; width: 100%;">

        <h3 class="text-center mb-3">🔐 Vérification 2FA</h3>

        <p class="text-center text-muted mb-4">
            Entrez le code à 6 chiffres généré par votre application.
        </p>

        <form method="POST" autocomplete="off">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

            <div class="mb-3">
                <input type="text" name="code" id="code" class="form-control text-center" placeholder="123456"
                    maxlength="6" inputmode="numeric" pattern="[0-9]*" required autofocus
                    style="font-size: 1.5rem; letter-spacing: 0.3rem;">
            </div>

            <input type="hidden" name="submitted" value="1">

            <div class="form-check mb-3">
                <input class="form-check-input" type="checkbox" name="confiance" value="1" id="confiance" checked>
                <label class="form-check-label" for="confiance">
                    Ne plus me demander de code sur cet appareil pendant {{ confiance_jours }} jours
                </label>
            </div>

            <div class="d-grid">
                <button type="submit" class="btn btn-primary">
                    ✅ Valider
                </button>
            </div>

        </form>

        <div class="text-center mt-3 small">
            Téléphone pas sous la main ?
            <a href="{{ url_for('login_code') }}">Recevoir un code par SMS ou email</a>
        </div>

    </div>

</div>

<!-- 🎯 Focus + sélection automatique -->
<script>
    window.addEventListener("DOMContentLoaded", function () {
        const input = document.getElementById("code");
        if (input) {
            input.focus();
            input.select();
        }
    });
</script>

{% endblock %}
