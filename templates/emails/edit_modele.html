{% extends "base.html" %}
{% block content %}

<h2>{{ "Modifier" if modele else "Nouveau" }} modèle</h2>

<form method="POST">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

    <div class="mb-3">
        <label>Code modèle</label>
        <input type="text" name="code_modele" class="form-control"
               value="{{ modele.code_modele if modele else '' }}" required>
    </div>

    <div class="mb-3">
        <label>Sujet</label>
        <input type="text" name="sujet" class="form-control"
               value="{{ modele.sujet if modele else '' }}" required>
    </div>

    <div class="mb-3">
        <label>Catégorie</label>
        <select name="type_periode" class="form-select">
            <option value="" {% if not modele or not modele.type_periode %}selected{% endif %}>-- Aucune (n'apparaîtra dans aucun envoi) --</option>
            <option value="trimestriel" {% if modele and modele.type_periode == 'trimestriel' %}selected{% endif %}>Indicateurs trimestriels</option>
            <option value="annuel" {% if modele and modele.type_periode == 'annuel' %}selected{% endif %}>Indicateurs annuels</option>
            <option value="facture" {% if modele and modele.type_periode == 'facture' %}selected{% endif %}>Facturation (participation, cotisations)</option>
        </select>
        <small class="form-text text-muted">
            Détermine sur quel écran d'envoi (« Envoyer mails » d'une campagne indicateurs) ce modèle apparaît dans la liste déroulante.
        </small>
    </div>

    <div class="mb-3">
        <label>Corps</label>
        <textarea name="corps" class="form-control" rows="10">{{ modele.corps if modele else '' }}</textarea>
    </div>

    <button type="submit" name="action" value="save" class="btn btn-success">💾 Enregistrer</button>

    {% if env_name|upper == 'DEV' %}
    <button type="submit" name="action" value="save_both" class="btn btn-primary"
            onclick="return confirm('Enregistrer ce modèle à la fois en DEV et en PROD ?');">
        💾 Enregistrer en DEV et PROD
    </button>
    {% endif %}

    <a href="{{ url_for('emails.liste_modeles') }}"
    target="emails_window"
    class="btn btn-secondary">
        Retour
    </a>

</form>

{% endblock %}
