{% extends "base.html" %}
{% block content %}

<div class="page-sticky-header d-flex justify-content-between align-items-center">

    <h2>✉️ Modèles d'emails</h2>

    <div class="btn-group-ba38">

        <!-- ✔ Nouveau modèle -->
        <a href="{{ url_for('emails.edit_modele') }}" 
           target="emails_window"
           class="btn btn-success btn-sm">
            ➕ Nouveau modèle
        </a>

        <!-- ✔ Retour -->
        <!-- <a href="{{ url_for('indicateurs.index') }}" 
           class="btn btn-outline-secondary btn-sm">
            ⬅️ Retour
        </a> -->

    </div>
</div>

<table class="table table-striped">
    <thead>
        <tr>
            <th>Code</th>
            <th>Sujet</th>
            <th>Actions</th>
        </tr>
    </thead>

    <tbody>
        {% for m in modeles %}
        <tr>
            <td>{{ m.code_modele }}</td>
            <td>{{ m.sujet }}</td>
            <td>
                <a href="{{ url_for('emails.edit_modele', id=m.id) }}" 
                   target="emails_window"
                   class="btn btn-sm btn-primary">✏️</a>

                <a href="{{ url_for('emails.delete_modele', id=m.id) }}" 
                   target="emails_window"
                   class="btn btn-sm btn-danger">🗑️</a>
            </td>
        </tr>
        {% endfor %}
    </tbody>
</table>

{% endblock %}
