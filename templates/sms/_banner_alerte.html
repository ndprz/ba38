{% set alerte = sms_alerte_active() %}
{% if alerte %}
<div class="alert alert-danger d-flex justify-content-between align-items-center">
  <div>🚨 {{ alerte.message }}</div>
  {% if has_access('sms_benevoles', 'ecriture') %}
  <form method="post" action="{{ url_for('sms.resoudre_alerte_sms', alerte_id=alerte.id) }}" class="ms-3">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <button type="submit" class="btn btn-sm btn-outline-dark">✔️ Marquer comme résolu</button>
  </form>
  {% endif %}
</div>
{% endif %}
