<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Modèle Planning VIF</title>
  <style>
    @page { size: A3 landscape; margin: 1cm; }
    body {
      font-family: Arial, sans-serif;
      font-size: 11px;
      color: black;
      background: white;
      margin: 0;
      padding: 1cm;
    }
    h2 {
      text-align: center;
      margin-bottom: 20px;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-bottom: 25px;
    }
    th, td {
      border: 1px solid #444;
      padding: 4px 8px;
      text-align: center;
      vertical-align: middle;
    }
    th {
      background-color: #f2f2f2;
      font-weight: bold;
    }
  </style>
</head>
<body>

<h2>🛠️ Modèle du Planning VIF</h2>

<table>
  <thead>
    <tr>
      <th>Jour</th>
      <th>VIF matin</th>
      <th>VIF après-midi</th>
      <th>Durée</th>
    </tr>
  </thead>
  <tbody>
    {% for ligne in lignes %}
    <tr>
      <td style="text-align:left;font-weight:bold;">{{ ligne.jour|capitalize }}</td>
      <td>{{ bene_dict.get(ligne.vif01_id, "") }}</td>
      <td>{{ bene_dict.get(ligne.vif02_id, "") }}</td>
      <td>{{ ligne.duree or "" }}</td>
    </tr>
    {% endfor %}
  </tbody>
</table>

</body>
</html>
