{% macro input_date(name, label="", value="", required=False) %}

<div class="mb-3">

    {% if label %}
    <label for="{{ name }}">{{ label }}</label>
    {% endif %}

    <input type="text" name="{{ name }}" id="{{ name }}" class="form-control date-fr" placeholder="jj/mm ou jjmmaaaa"
        value="{{ value }}" autocomplete="off" {% if required %}required{% endif %}>

</div>

{% endmacro %}
