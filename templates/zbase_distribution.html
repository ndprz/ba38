<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Module Distribution{% endblock %}</title>

    <link rel="icon" type="image/png" href="{{ url_for('static', filename='images/logo-circle-orange.svg') }}">

    <link rel="stylesheet" href="{{ url_for('static', filename='css/bootstrap-custom.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/public.css') }}">

    <style>
        body {
            background-color: #f5f5f5;
        }

        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 20px;
            background-color: #fff;
            border-bottom: 2px solid #ddd;
        }

        .user-info {
            font-size: 0.9rem;
        }

        footer {
            text-align: center;
            padding: 10px;
            background-color: #fff;
            border-top: 2px solid #ddd;
            margin-top: 40px;
        }
    </style>
</head>

<body>


    {% include "_flash.html" %}

    <!-- Sécurité : blocage si pas droit -->
    {% if not has_access("distribution", "lecture") %}
    <div class="container mt-5">
        <div class="alert alert-danger text-center">
            ⛔ Accès non autorisé au module Distribution.
        </div>
    </div>
    {% else %}

    <main class="container mt-4">
        {% block content %}{% endblock %}
    </main>

    {% endif %}


    <footer>
        &copy; 2026 BA38 — Distribution —
        {% include "partials/_version.html" %}
    </footer>

    <script src="{{ url_for('static', filename='js/jquery-3.5.1.min.js') }}"></script>
    <script src="{{ url_for('static', filename='js/bootstrap.bundle.min.js') }}"></script>
    <script src="{{ url_for('static', filename='js/layout.js') }}"></script>



    {% block scripts %}{% endblock %}

</body>

</html>
