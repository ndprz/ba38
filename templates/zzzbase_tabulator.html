<!DOCTYPE html>
<html lang="fr">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1">

    <title>
        {% block title %}BA38{% endblock %}
    </title>

    <!-- ===================================================== -->
    <!-- BOOTSTRAP -->
    <!-- ===================================================== -->

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <!-- ===================================================== -->
    <!-- TABULATOR -->
    <!-- ===================================================== -->

    <link
        href="https://unpkg.com/tabulator-tables@6.2.5/dist/css/tabulator_bootstrap5.min.css"
        rel="stylesheet">

    <script
        src="https://unpkg.com/tabulator-tables@6.2.5/dist/js/tabulator.min.js">
    </script>

<style>

/* =====================================================
   GLOBAL
===================================================== */

html,
body{

    height:100%;

    margin:0;

    padding:0;

    overflow:hidden;

    background:#f5f5f5;

    font-family:Roboto, Arial, sans-serif;

    font-size:13px;
}


/* =====================================================
   BODY
===================================================== */

body{

    display:flex;

    flex-direction:column;
}


/* =====================================================
   NAVBAR
===================================================== */

.main-navbar{

    flex:0 0 auto;

    background:white;

    border-bottom:1px solid #ddd;

    padding:6px 12px;
}


/* =====================================================
   WRAPPER
===================================================== */

.main-wrapper{

    flex:1 1 auto;

    min-height:0;

    overflow:hidden;

    display:flex;

    flex-direction:column;
}


/* =====================================================
   PAGE CONTENT
===================================================== */

.page-content{

    flex:1 1 auto;

    min-height:0;

    overflow:hidden;

    display:flex;

    flex-direction:column;

    padding:8px 8px 24px 8px;
}


/* =====================================================
   PAGE HEADER
===================================================== */

.page-header{

    flex:0 0 auto;

    background:white;

    border:1px solid #ddd;

    border-radius:6px;

    padding:8px 12px;

    margin-bottom:8px;
}


.page-header h1{

    font-size:1.35rem;

    margin:0 0 8px 0;

    font-weight:600;
}


/* =====================================================
   BOUTONS
===================================================== */

.page-header .btn{

    font-size:12px !important;

    padding:4px 10px !important;

    line-height:1.2 !important;
}


/* =====================================================
   FIELDSET
===================================================== */

fieldset{

    border:1px solid #ccc;

    border-radius:6px;

    padding:8px 10px;

    margin-top:8px;
}


legend{

    font-size:13px;

    font-weight:600;

    width:auto;

    padding:0 6px;

    margin-bottom:5px;
}


/* =====================================================
   GROUPES
===================================================== */

.fields-group{

    min-width:220px;

    padding:5px 8px;

    border:1px solid #ddd;

    border-radius:6px;

    background:white;

    font-size:12px;
}


.titre-depliable{

    cursor:pointer;

    user-select:none;

    font-weight:600;

    font-size:12px;
}


.fields-container{

    display:none;

    padding-left:18px;

    margin-top:5px;
}


.fields-container.expanded{

    display:block;
}


.fields-container label{

    display:block;

    margin-bottom:2px;

    line-height:1.15;

    font-size:12px;
}


/* =====================================================
   INPUTS
===================================================== */

.form-control{

    font-size:12px !important;

    padding:4px 8px !important;

    min-height:30px;
}


#filtre-association{

    max-width:350px;
}


/* =====================================================
   TABLE ZONE
===================================================== */

.table-zone{

    flex:1 1 auto;

    min-height:0;

    overflow:hidden;

    border:1px solid #ccc;

    background:white;

    border-radius:6px;
}


/* =====================================================
   TABULATOR
===================================================== */

#tabulator-table{

    height:100%;
}


.tabulator{

    height:100% !important;

    font-size:12px !important;

    border:none !important;
}


/* =====================================================
   HEADER TABULATOR
===================================================== */

.tabulator .tabulator-header{

    background:#f8f9fa;

    border-bottom:1px solid #ccc;
}


.tabulator .tabulator-header .tabulator-col{

    min-height:30px !important;

    padding:3px 6px !important;

    background:#f8f9fa;

    font-weight:600;

    font-size:12px;
}


/* =====================================================
   CELLULES
===================================================== */

.tabulator-row{

    min-height:24px !important;
}


.tabulator-row .tabulator-cell{

    padding:3px 6px !important;

    white-space:nowrap;

    line-height:1.15;
}


/* =====================================================
   LIGNES ALTERNÉES
===================================================== */

.tabulator-row:nth-child(even){

    background:#fafafa;
}


/* =====================================================
   CHECKBOXES
===================================================== */

input[type="checkbox"]{

    accent-color:#198754;
}


/* =====================================================
   FOOTER FIXE
===================================================== */

.bottom-bar{

    position:fixed;

    bottom:0;

    left:0;

    width:100%;

    background:#f5e9c9;

    border-top:1px solid #d8c9a3;

    font-size:11px;

    font-weight:600;

    padding:3px 10px;

    z-index:5000;
}


.bottom-inner{

    display:flex;

    justify-content:space-between;

    align-items:center;

    gap:20px;

    white-space:nowrap;
}


.bottom-left{

    color:#7b5f16;
}


.bottom-right{

    color:#555;

    text-align:right;
}

</style>

{% block extra_head %}{% endblock %}

</head>

<body>

    <!-- ===================================================== -->
    <!-- NAVBAR -->
    <!-- ===================================================== -->

    <div class="main-navbar">

        <strong>
            BA38
        </strong>

    </div>

    <!-- ===================================================== -->
    <!-- WRAPPER -->
    <!-- ===================================================== -->

    <div class="main-wrapper">

        <div class="page-content">

            {% block content %}
            {% endblock %}

        </div>

    </div>

    <!-- ===================================================== -->
    <!-- BARRE BAS -->
    <!-- ===================================================== -->

    <div class="bottom-bar">

        <div class="bottom-inner">

            <div class="bottom-left">

                {% if db_info %}
                    ⚙️ Base en cours : {{ db_info }}
                {% endif %}

            </div>

            <div class="bottom-right">

                © 2025 Gestion BA38 —
                {% include "partials/_version.html" %}

            </div>

        </div>

    </div>

    <!-- ===================================================== -->
    <!-- BOOTSTRAP JS -->
    <!-- ===================================================== -->

    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>

</body>

</html>
