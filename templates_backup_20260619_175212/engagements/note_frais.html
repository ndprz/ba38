{% extends "base.html" %}

{% block title %}
Note de frais
{% endblock %}

{% block content %}

<div class="container mt-4">

    <h2>
        🚗 Note de frais
    </h2>

    <form method="POST">

        <div class="card mb-4">

            <div class="card-body">

                <div class="row mb-3">

                    <div class="col-md-6">

                        <label class="form-label">
                            Nom / prénom
                        </label>

                        <input type="text"
                               class="form-control"
                               value="{{ engagement.demandeur_nom }}"
                               readonly>

                    </div>

                    <div class="col-md-6">

                        <label class="form-label">
                            Objet
                        </label>

                        <input type="text"
                               name="objet"
                               class="form-control"
                               value="{{ engagement.objet }}">

                    </div>

                </div>

                <div class="row mb-3">

                    <div class="col-md-3">

                        <label class="form-label">
                            Date
                        </label>

                        <input type="date"
                               name="date_frais"
                               class="form-control"
                               required>

                    </div>

                    <div class="col-md-3">

                        <label class="form-label">
                            Nb kilomètres
                        </label>

                        <input type="number"
                               step="0.1"
                               name="kms"
                               class="form-control"
                               required>

                    </div>

                    <div class="col-md-3">

                        <label class="form-label">
                            Péages (€)
                        </label>

                        <input type="text"
                               inputmode="decimal"
                               name="peages"
                               class="form-control"
                               value="0">

                    </div>

                    <div class="col-md-3">

                        <label class="form-label">
                            Repas (€)
                        </label>

                        <input type="text"
                               inputmode="decimal"
                               name="repas"
                               class="form-control"
                               value="0">

                    </div>

                </div>

                <div class="mb-3">

                    <label class="form-label">
                        Commentaire
                    </label>

                    <textarea name="commentaire"
                              class="form-control"
                              rows="4"></textarea>

                </div>

            </div>

        </div>

        <div class="d-flex gap-2">

            <button type="submit"
                    class="btn btn-success">

                💾 Générer la note de frais

            </button>

            <a href="{{ url_for(
                    'engagements.detail_engagement',
                    engagement_id=engagement.id
            ) }}"
               class="btn btn-secondary">

                ↩ Retour

            </a>

        </div>

    </form>

</div>

{% endblock %}
